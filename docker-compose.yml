version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: editorial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-editorial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editorial_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-editorial_workspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-editorial_user} -d ${POSTGRES_DB:-editorial_workspace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - editorial-network

  redis:
    image: redis:7-alpine
    container_name: editorial-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - editorial-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: editorial-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-editorial_user}:${POSTGRES_PASSWORD:-editorial_secret_pass}@db:5432/${POSTGRES_DB:-editorial_workspace}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-editorial_prod_master_secret_key_change_in_production_32_chars}
      ENVIRONMENT: production
      TESTING: "False"
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1"
      FRONTEND_ORIGIN: "http://localhost"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/backend/data
      - backend_backups:/app/backend/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - editorial-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: editorial-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - editorial-network

volumes:
  postgres_data:
  redis_data:
  backend_data:
  backend_backups:

networks:
  editorial-network:
    driver: bridge
