services:
  - type: web
    name: ai-editorial-workspace-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./editorial.db
      - key: FRONTEND_ORIGIN
        value: "https://your-frontend-deployment.vercel.app"
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_API_KEY
        sync: false

