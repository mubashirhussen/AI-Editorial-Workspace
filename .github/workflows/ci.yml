name: CI/CD Pipeline - Continuous Integration

on:
  push:
    branches: [ main, master, 'feat/**', 'release/**', 'docs/**' ]
  pull_request:
    branches: [ main, master, 'release/**' ]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday health run
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Bytecode & Syntax Verification
        run: |
          python -m compileall backend/app backend/tests scripts

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type Checking
        working-directory: frontend
        run: npm run build -- --noEmit || npx tsc --noEmit

  backend-tests:
    name: Backend Test Suite (Postgres & Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: editorial_user
          POSTGRES_PASSWORD: test_secure_password_123
          POSTGRES_DB: editorial_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://editorial_user:test_secure_password_123@localhost:5432/editorial_test_db
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: testing
      TESTING: "True"
      SECRET_KEY: ci_test_environment_secret_key_32_characters_minimum
      ALLOW_ANONYMOUS_DEV: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Database Migrations
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Execute Full Pytest Regression Suite
        run: |
          pytest backend/tests -v --junitxml=junit-backend.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: junit-backend.xml

  frontend-build:
    name: Frontend Production Build & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Production Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker-build-verification:
    name: Multi-Stage Docker Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: editorial-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: editorial-frontend:ci-test

