name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./ci_test.db
      ENVIRONMENT: testing
      TESTING: "True"
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m compileall backend/app backend/tests

      - name: Run Database Migrations & Verify Schema Consistency
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini current

      - name: Run Pytest Suite with JUnit Reporting
        run: |
          pytest backend/tests -v --junitxml=backend-test-results-py${{ matrix.python-version }}.xml

      - name: Upload Pytest Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-py${{ matrix.python-version }}
          path: backend-test-results-py${{ matrix.python-version }}.xml
          if-no-files-found: ignore

